<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` is what makes `env(safe-area-inset-*)` mean
      anything: without it the transport pill sits under the home indicator on
      a tablet, and the insets the stylesheet already asks for resolve to zero.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Piano Sight-Reading Trainer</title>

    <!--
      Added to the Home Screen, iPadOS runs this without Safari's chrome at
      all - which is the only way to be rid of the floating close button and
      the swipe-down gesture that fullscreen brings. Neither can be turned off
      from a page, deliberately: a browser has to leave the reader a way out
      of fullscreen. Standalone is not fullscreen, so there is nothing to
      leave.
    -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#14181f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sight Reading" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" href="icon-192.png" sizes="192x192" type="image/png" />
  </head>
  <body>
    <div class="app" id="app">
      <header class="app-header">
        <div class="brand">
          <h1>Piano Sight-Reading Trainer</h1>
          <p id="exercise-title" class="subtitle">No exercise loaded</p>
        </div>
        <div class="midi-cluster">
          <span id="pedal-status" class="pill pill--pedal" data-down="false"
            aria-label="Sustain pedal up"><span class="pill__dot" aria-hidden="true"></span>Ped.</span>
          <span id="bridge-status" class="pill pill--idle" hidden>Bridge: connecting…</span>
          <span id="midi-status" class="pill pill--idle">MIDI: not connected</span>
          <button id="connect-midi" type="button" class="button button--ghost">Connect MIDI</button>
          <select id="midi-input" aria-label="MIDI input device">
            <option value="">All inputs</option>
          </select>
          <p id="midi-hint" class="hint midi-hint" hidden></p>
        </div>
      </header>

      <p id="import-notice" class="hint import-notice" hidden></p>

      <div class="toolbar">
        <button id="start" type="button" class="button button--primary" title="Space">Start</button>
        <button id="pause" type="button" class="button" title="Space" disabled>Pause</button>
        <button id="stop" type="button" class="button button--ghost" disabled>Stop</button>
        <button id="listen" type="button" class="button">Listen</button>
        <select id="listen-hand" title="Which hand to read and to hear">
          <option value="">Both hands</option>
          <option value="1">Right hand only</option>
          <option value="2">Left hand only</option>
        </select>
        <span class="toolbar__bars">
          <label for="range-from">Bars</label>
          <input id="range-from" type="number" min="1" max="999" placeholder="first" />
          <span aria-hidden="true">–</span>
          <input id="range-to" type="number" min="1" max="999" placeholder="last" />
          <label class="toolbar__repeat">
            <input id="repeat-range" type="checkbox" />
            <span>Repeat</span>
          </label>
        </span>
        <button id="keep-take" type="button" class="button button--record" disabled>
          <span class="button__dot" aria-hidden="true"></span>Keep take
        </button>
        <span class="toolbar__gap"></span>
        <button id="new-exercise" type="button" class="button">New exercise</button>
        <button id="open-score" type="button" class="button">Open score…</button>
        <!--
          No `accept`: iOS resolves it to its own file types, and `.mxl` is not
          one it knows - so a picker that named it greyed out every score the
          reader owns. What the file actually is gets decided on opening, where
          it can be answered honestly.
        -->
        <input id="score-file" type="file" hidden />
        <button id="focus" type="button" class="button">Fullscreen</button>
      </div>

      <main class="layout">
        <section id="score" class="score" aria-label="Score">
          <div id="score-scroll" class="score__scroll">
            <div id="score-surface" class="score__surface"></div>
          </div>
          <div id="score-cover" class="score__cover" hidden>
            <p id="score-cover-text" class="score__cover-text"></p>
          </div>
        </section>

        <aside class="panel">
          <div class="panel__row">
            <span class="label">Session</span>
            <strong id="session-status">Idle</strong>
          </div>
          <div id="expected-row" class="panel__row">
            <span class="label">Play now</span>
            <strong id="expected" class="expected">—</strong>
          </div>
          <progress id="progress" value="0" max="1"></progress>
          <div class="panel__row panel__row--compact">
            <span class="label">Position</span>
            <span id="position">—</span>
          </div>

          <ul id="log" class="log" aria-label="Recent notes"></ul>

          <section id="scores" class="takes" hidden aria-label="Kept scores">
            <div class="panel__row panel__row--compact">
              <span class="label">Scores</span>
              <button id="scores-clear" type="button" class="button button--ghost takes__clear">
                Delete all
              </button>
            </div>
            <ul id="scores-list" class="takes__list"></ul>
          </section>

          <section id="takes" class="takes" hidden aria-label="Kept takes">
            <div class="panel__row panel__row--compact">
              <span class="label">Takes</span>
              <button id="takes-clear" type="button" class="button button--ghost takes__clear">
                Delete all
              </button>
            </div>
            <ul id="takes-list" class="takes__list"></ul>
          </section>

          <div id="result" class="result" hidden></div>
        <button id="drill" type="button" class="button" hidden>Drill the worst bars</button>
        </aside>
      </main>

      <footer class="controls">
        <div class="control-group">
          <label for="ladder-down">Ladder</label>
          <div class="ladder-row">
            <button id="ladder-down" type="button" class="button" aria-label="Down a rung">◀</button>
            <strong id="ladder-step" class="ladder-row__step">—</strong>
            <button id="ladder-up" type="button" class="button" aria-label="Up a rung">▶</button>
          </div>
          <p id="ladder-description" class="hint"></p>
        </div>

        <div class="control-group">
          <label for="preset">Level</label>
          <select id="preset"></select>
          <p id="preset-description" class="hint"></p>
        </div>

        <div class="control-group">
          <label for="rhythm">Rhythm</label>
          <select id="rhythm"></select>
          <p id="rhythm-description" class="hint"></p>
        </div>

        <div class="control-group">
          <label for="mode">Mode</label>
          <select id="mode"></select>
          <p id="mode-description" class="hint"></p>
        </div>

        <div class="control-group">
          <label for="scoring">Graded on</label>
          <select id="scoring"></select>
          <p id="scoring-description" class="hint"></p>
        </div>

        <div class="control-group">
          <label for="key">Key</label>
          <select id="key"></select>
        </div>

        <div class="control-group">
          <label for="time-signature">Time</label>
          <select id="time-signature"></select>
        </div>

        <div class="control-group">
          <label for="measures">
            Bars:
            <input
              id="measures-value"
              class="number-input"
              type="number"
              min="1"
              max="32"
              step="1"
              value="4"
              aria-label="Number of bars"
            />
          </label>
          <input id="measures" type="range" min="1" max="32" step="1" value="4" />
        </div>

        <div class="control-group">
          <label for="tempo">Tempo: <output id="tempo-value">60</output> bpm</label>
          <input id="tempo" type="range" min="30" max="180" step="1" value="60" />
        </div>

        <div class="control-group">
          <label for="click">Click on</label>
          <select id="click"></select>
          <p id="click-description" class="hint"></p>
        </div>

        <div class="control-group">
          <label for="dropout">Metronome sounds</label>
          <select id="dropout"></select>
          <p id="dropout-description" class="hint"></p>
        </div>

        <div class="control-group">
          <label for="preview">Look before playing: <output id="preview-value">0</output> s</label>
          <input id="preview" type="range" min="0" max="20" step="1" value="0" />
          <p class="hint">A scan the run starts itself after, so the look is deliberate.</p>
        </div>

        <div class="control-group">
          <label for="count-in">Count-in: <output id="count-in-value">1</output> bars</label>
          <input id="count-in" type="range" min="0" max="4" step="1" value="1" />
        </div>

        <div class="control-group">
          <label for="tolerance">Chord window: <output id="tolerance-value">250</output> ms</label>
          <input id="tolerance" type="range" min="40" max="800" step="10" value="250" />
        </div>

        <div class="control-group">
          <label for="metronome-volume">
            Metronome: <output id="metronome-volume-value">60</output>%
          </label>
          <input id="metronome-volume" type="range" min="0" max="100" step="5" value="60" />
        </div>

        <div class="control-group">
          <label for="instrument-volume">
            Note sound: <output id="instrument-volume-value">60</output>%
          </label>
          <input id="instrument-volume" type="range" min="0" max="100" step="5" value="60" />
          <div class="knob-row">
            <button id="learn-knob" type="button" class="button button--ghost knob-row__learn">
              Use a knob
            </button>
            <span id="knob-status" class="hint knob-row__status"></span>
          </div>
        </div>

        <div class="control-group">
          <label for="zoom">Note size: <output id="zoom-value">85</output>%</label>
          <input id="zoom" type="range" min="40" max="220" step="5" value="85" />
        </div>

        <div class="control-group">
          <label for="show-played">Show what I played</label>
          <select id="show-played"></select>
          <p id="show-played-description" class="hint"></p>
        </div>

        <div class="control-group">
          <label for="read-ahead">Notes disappear</label>
          <select id="read-ahead"></select>
          <p id="read-ahead-description" class="hint"></p>
        </div>

        <div class="control-group">
          <label for="sample-loading">Piano samples</label>
          <select id="sample-loading">
            <option value="eager">Download on open</option>
            <option value="lazy">Download on first note</option>
            <option value="off">Do not download</option>
          </select>
          <p id="sample-loading-hint" class="hint"></p>
        </div>

        <div class="control-group control-group--checks">
          <label><input id="show-cursor" type="checkbox" checked /> Show cursor</label>
          <label><input id="blind-mode" type="checkbox" /> Blind mode: do not name the notes</label>
          <label><input id="pitch-class" type="checkbox" /> Ignore octaves</label>
          <label><input id="rhythm-only" type="checkbox" /> Rhythm only: any note counts</label>
          <label><input id="survival" type="checkbox" /> Survival: keep the bar up</label>
          <label><input id="audio-feedback" type="checkbox" checked /> Sound my notes</label>
          <label><input id="computer-keyboard" type="checkbox" checked /> Computer keyboard</label>
        </div>

      </footer>

      <div id="focus-bar" class="focus-bar" hidden data-open="false">
        <!--
          Beside the bar rather than in it, and taken out of the flow: the
          where the run is, what it is counting and how it ended - everything
          fullscreen has to say. All of it changes while the reader plays and
          all of it is wider than a button, so absolutely positioned it can
          neither change the bar's size nor shift it off centre.
        -->
        <div id="focus-notice" class="focus-notice">Idle</div>

        <button id="focus-handle" type="button" class="focus-bar__handle"
          aria-controls="focus-drawer" aria-expanded="false" title="More controls" aria-label="More controls"></button>

        <div id="focus-health" class="focus-bar__health" hidden>
          <div id="focus-health-fill" class="focus-bar__health-fill"></div>
        </div>

        <div class="focus-bar__row">
          <button id="focus-play" type="button"
            class="focus-bar__button focus-bar__button--primary focus-bar__button--icon"
            title="Start" aria-label="Start">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path id="focus-play-icon" d="M8 5l11 7-11 7z" />
            </svg>
          </button>
          <button id="focus-stop" type="button" class="focus-bar__button focus-bar__button--icon"
            title="Stop" aria-label="Stop" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M6 6h12v12H6z" />
            </svg>
          </button>
          <button id="focus-listen" type="button" class="focus-bar__button focus-bar__button--icon"
            title="Listen" aria-label="Listen">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path id="focus-listen-icon" d="M4 9v6h4l5 4V5L8 9H4zm12-.5a4.5 4.5 0 0 1 0 7v-2a2.5 2.5 0 0 0 0-3v-2z" />
            </svg>
          </button>

          <span class="focus-bar__tempo">
            <button id="focus-slower" type="button"
              class="focus-bar__button focus-bar__button--step" title="Slower" aria-label="Slower">−</button>
            <output id="focus-tempo" class="focus-bar__percent">100%</output>
            <button id="focus-faster" type="button"
              class="focus-bar__button focus-bar__button--step" title="Faster" aria-label="Faster">+</button>
          </span>

          <button id="focus-next" type="button" class="focus-bar__button focus-bar__button--icon"
            title="New exercise" aria-label="New exercise">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12 5V2L8 6l4 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z" />
            </svg>
          </button>
          <button id="focus-exit" type="button"
            class="focus-bar__button focus-bar__button--icon focus-bar__button--exit"
            title="Leave fullscreen" aria-label="Leave fullscreen">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M9 4H7v3H4v2h5V4zm6 0h-2v5h5V7h-3V4zM4 15v2h3v3h2v-5H4zm11 0v5h2v-3h3v-2h-5z" />
            </svg>
          </button>
        </div>

        <div id="focus-drawer" class="focus-bar__drawer">
          <!--
            The passage, written out. A slice is a score in its own right by
            the time it reaches the page, so without this the only thing that
            says a hundred-bar piece has been cut down to eight is the bar
            numbers printed over the staves. Here it is a number that can be
            read and typed over, and the button beside it is the way back.
          -->
          <span class="focus-bar__passage">
            <input id="focus-from" class="focus-bar__bar" type="number" min="1" max="999"
              inputmode="numeric" placeholder="first" title="First bar of the passage"
              aria-label="First bar of the passage" />
            <span class="focus-bar__dash" aria-hidden="true">–</span>
            <input id="focus-to" class="focus-bar__bar" type="number" min="1" max="999"
              inputmode="numeric" placeholder="last" title="Last bar of the passage"
              aria-label="Last bar of the passage" />
            <output id="focus-bars" class="focus-bar__total">—</output>
            <button id="focus-whole" type="button"
              class="focus-bar__button focus-bar__button--icon" title="Practise the whole piece"
              aria-label="Practise the whole piece">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M4 4h2v16H4zM18 4h2v16h-2zM8 11h8v2H8z" />
                <path d="M11 8l-3 4 3 4zM13 8l3 4-3 4z" />
              </svg>
            </button>
          </span>

          <span class="focus-bar__tempo">
            <button id="focus-smaller" type="button"
              class="focus-bar__button focus-bar__button--icon" title="Smaller notes" aria-label="Smaller notes">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M10.5 3a7.5 7.5 0 1 1-4.6 13.4l-3.2 3.3-1.4-1.4 3.3-3.2A7.5 7.5 0 0 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11zM7 9.5h7v2H7v-2z" />
              </svg>
            </button>
            <output id="focus-zoom" class="focus-bar__percent">85%</output>
            <button id="focus-bigger" type="button"
              class="focus-bar__button focus-bar__button--icon" title="Bigger notes" aria-label="Bigger notes">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M10.5 3a7.5 7.5 0 1 1-4.6 13.4l-3.2 3.3-1.4-1.4 3.3-3.2A7.5 7.5 0 0 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11zM9.5 7h2v2.5H14v2h-2.5V14h-2v-2.5H7v-2h2.5V7z" />
              </svg>
            </button>
          </span>

          <!--
            The three answers a thumb needs mid-practice. The cycles - a bar
            on, a bar off - stay in the settings: they are chosen deliberately
            before a run, not reached for between two.
          -->
          <button id="focus-click" type="button"
            class="focus-bar__button focus-bar__button--icon focus-bar__click"
            data-click="always" title="Metronome: all the way through"
            aria-label="Metronome: all the way through">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M9.2 2h5.6l3.6 20H5.6L9.2 2zm1.7 2-2.5 14h6.2l-2.5-14h-1.2z" />
              <path d="M16.8 5.6 8.4 14.2l1 1.4 8.7-8.9-1.3-1.1z" />
            </svg>
          </button>

          <!--
            How much of the pulse is clicked. Its own question from when the
            click sounds at all: two clicks a bar is a metre, not a volume.
          -->
          <button id="focus-pattern" type="button"
            class="focus-bar__button focus-bar__button--icon focus-bar__pattern"
            data-pattern="pulse" title="Click: every beat" aria-label="Click: every beat">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <rect class="focus-bar__beat" data-at="1" x="2" y="6" width="3" height="12" />
              <rect class="focus-bar__beat" data-at="2" x="8" y="6" width="3" height="12" />
              <rect class="focus-bar__beat" data-at="3" x="14" y="6" width="3" height="12" />
              <rect class="focus-bar__beat" data-at="4" x="20" y="6" width="3" height="12" />
            </svg>
          </button>

          <button id="focus-wait" type="button"
            class="focus-bar__button focus-bar__button--icon focus-bar__toggle"
            aria-pressed="false" title="Wait for the notes" aria-label="Wait for the notes">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm0 2a8 8 0 1 0 0 16 8 8 0 0 0 0-16zm1 3v5.3l3.6 2.1-1 1.7L11 13.5V7h2z" />
            </svg>
          </button>

          <button id="focus-cursor" type="button"
            class="focus-bar__button focus-bar__button--icon focus-bar__toggle"
            aria-pressed="true" title="Show the cursor" aria-label="Show the cursor">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M11 3h2v18h-2z" />
              <path d="M8 3h8v2H8zM8 19h8v2H8z" />
            </svg>
          </button>

          <button id="focus-marks" type="button"
            class="focus-bar__button focus-bar__button--icon focus-bar__toggle"
            aria-pressed="true" title="Show what I played" aria-label="Show what I played">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M15 4h2v10.2a3.8 3.8 0 1 1-2-3.3V4z" />
              <path d="M4 7h8v2H4zM4 12h6v2H4zM4 17h6v2H4z" />
            </svg>
          </button>

          <button id="focus-survival" type="button"
            class="focus-bar__button focus-bar__button--icon focus-bar__toggle"
            aria-pressed="false" title="Survival: keep the bar up" aria-label="Survival: keep the bar up">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12 21s-7.5-4.6-7.5-10.1A4.4 4.4 0 0 1 12 7.6a4.4 4.4 0 0 1 7.5 3.3C19.5 16.4 12 21 12 21z" />
            </svg>
          </button>

          <button id="focus-hands" type="button" class="focus-bar__button focus-bar__hands"
            title="Both hands" aria-label="Both hands">
            <svg id="focus-hand-left" class="focus-bar__hand" viewBox="0 0 24 24"
              aria-hidden="true" focusable="false">
              <path d="M16 11V5.5a1.5 1.5 0 0 0-3 0V10h-.5V4.5a1.5 1.5 0 0 0-3 0V10H9V6a1.5 1.5 0 0 0-3 0v8a6 6 0 0 0 6 6h1a5 5 0 0 0 4.1-2.1L20 14.5a1.5 1.5 0 0 0-2.2-2L16 14.5z" />
            </svg>
            <svg id="focus-hand-right" class="focus-bar__hand" viewBox="0 0 24 24"
              aria-hidden="true" focusable="false">
              <path d="M8 11V5.5a1.5 1.5 0 0 1 3 0V10h.5V4.5a1.5 1.5 0 0 1 3 0V10H15V6a1.5 1.5 0 0 1 3 0v8a6 6 0 0 1-6 6h-1a5 5 0 0 1-4.1-2.1L4 14.5a1.5 1.5 0 0 1 2.2-2L8 14.5z" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
